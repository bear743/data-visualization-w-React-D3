<!DOCTYPE html>
<html>
  <head>
    <title>Missing Migrants</title>
    <link
      href="https://fonts.googleapis.com/css?family=Poppins&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: 'Poppins', sans-serif;
      }
      pre {
        font-size: 7em;
      }
      .tick text {
        fill: #635F5D;
        font-size: 0.5em;
      }
      .mark {
        fill: #137B80;
      }
      .axis-label {
        font-size: 0.5em;
        fill: #635F5D;
      }

      .marks .land {
        fill: #ececec;
        stroke: #C0C0BB;
      }
      .marks .sphere {
        fill: #fbfbfb;
      }
      .marks .interiors {
        fill: none;
        stroke: #d9dfe0;
      }
      .marks .graticules, .tick line {
        fill: none;
        stroke: #ececec;
      }
      .marks circle {
        fill: #137B80;
        opacity: 0.3;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
